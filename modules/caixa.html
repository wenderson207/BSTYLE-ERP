<style>
  .ffield{ margin-bottom:14px; }
  .ffield label{ display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .ffield input, .ffield select{ width:100%; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:10px 12px; border-radius:8px; font-size:13px; }
  .frow2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
</style>

<div class="toolbar">
  <div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Caixa Diário</h1>
  <p style="color:var(--text-secondary); font-size:13px; margin:0;">Confere se o dinheiro que devia ter no caixa bate com o que tem de verdade, no fim do dia.</p></div>
</div>

<div class="card" style="background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; padding:20px 22px;">
  <div id="caixaConteudo">Carregando…</div>
</div>

<script>
(async function(){
  function moeda(v){ return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }

  let empresas = [];
  function nomeLoja(id){ if (!id) return 'Compartilhado'; const e = empresas.find(x=>x.ID===id); return e?e.NOME:'—'; }

  function chaveDoDiaCaixa(lojaId){ return (lojaId||'sem-loja') + '_' + new Date().toISOString().substring(0,10); }

  async function carregarCaixa(){
    const el = document.getElementById('caixaConteudo');
    try {
      if (!(await checarPermissao('CAIXA','VISUALIZAR'))){ el.textContent = 'Sem permissão.'; return; }
      empresas = await dbGetAll('EMPRESAS');
      const lojaId = window.lojaAtivaId || await obterLojaParaAcao('Caixa de qual loja você quer conferir?');
      if (!lojaId) { el.textContent = 'Escolha uma loja pra ver o caixa.'; return; }
      const idDia = chaveDoDiaCaixa(lojaId);
      const caixaHoje = await dbGetById('CAIXA', idDia);

      if (!caixaHoje || caixaHoje.STATUS === 'Fechado') {
        el.innerHTML = `
          <p style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">${caixaHoje ? 'Caixa de hoje já foi fechado. Você pode abrir de novo se precisar lançar algo a mais.' : 'Caixa de hoje ainda não foi aberto.'}</p>
          <div class="frow2" style="max-width:400px;">
            <div class="ffield"><label>Valor inicial em caixa (R$)</label><input id="valorAbertura" type="number" step="0.01" value="0"></div>
          </div>
          <button class="btn btn-primary" id="btnAbrirCaixa">Abrir caixa</button>`;
        document.getElementById('btnAbrirCaixa').addEventListener('click', async () => {
          try {
            if (!(await checarPermissao('CAIXA','CADASTRAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
            await dbInsert('CAIXA', { ID: idDia, EMPRESA_ID: lojaId, DATA: new Date().toISOString(), VALOR_ABERTURA: Number(document.getElementById('valorAbertura').value)||0, STATUS: 'Aberto', USUARIO_ABERTURA: usuarioAtual.ID });
            mostrarToast('Caixa aberto.'); carregarCaixa();
          } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
        });
        return;
      }

      const vendasHoje = (await dbGetAll('VENDAS')).filter(v => v.EMPRESA_ID === lojaId && v.STATUS === 'Concluída' && new Date(v.DATA).toDateString() === new Date().toDateString());

      // Detalha por forma de pagamento de verdade (Dinheiro, PIX, Débito, Crédito) —
      // vendas "Combinada" são quebradas nas partes de FORMAS_PAGAMENTO, senão ficariam
      // escondidas numa categoria só.
      const porForma = { 'Dinheiro':0, 'PIX':0, 'Cartão de Débito':0, 'Cartão de Crédito':0 };
      vendasHoje.forEach(v => {
        if (v.FORMA_PAGAMENTO === 'Combinado' && Array.isArray(v.FORMAS_PAGAMENTO)) {
          v.FORMAS_PAGAMENTO.forEach(f => { porForma[f.forma] = (porForma[f.forma]||0) + Number(f.valor||0); });
        } else {
          porForma[v.FORMA_PAGAMENTO] = (porForma[v.FORMA_PAGAMENTO]||0) + Number(v.VALOR_TOTAL||0);
        }
      });
      const dinheiroHoje = porForma['Dinheiro'];
      const totalVendidoHoje = vendasHoje.reduce((s,v)=>s+Number(v.VALOR_TOTAL||0),0);
      const esperadoEmCaixa = Number(caixaHoje.VALOR_ABERTURA||0) + dinheiroHoje;

      el.innerHTML = `
        <div class="kpi-grid" style="margin-bottom:18px;">
          <div class="kpi"><div class="lbl">Abertura</div><div class="val">${moeda(caixaHoje.VALOR_ABERTURA)}</div></div>
          <div class="kpi"><div class="lbl">Total vendido hoje</div><div class="val">${moeda(totalVendidoHoje)}</div></div>
          <div class="kpi"><div class="lbl">Esperado em caixa (dinheiro)</div><div class="val">${moeda(esperadoEmCaixa)}</div></div>
        </div>
        <div class="kpi-grid" style="margin-bottom:18px;">
          <div class="kpi"><div class="lbl">💵 Dinheiro</div><div class="val">${moeda(porForma['Dinheiro'])}</div></div>
          <div class="kpi"><div class="lbl">💠 PIX</div><div class="val">${moeda(porForma['PIX'])}</div></div>
          <div class="kpi"><div class="lbl">💳 Débito</div><div class="val">${moeda(porForma['Cartão de Débito'])}</div></div>
          <div class="kpi"><div class="lbl">💳 Crédito</div><div class="val">${moeda(porForma['Cartão de Crédito'])}</div></div>
        </div>
        <div class="frow2" style="max-width:400px;">
          <div class="ffield"><label>Valor contado ao fechar (R$)</label><input id="valorContado" type="number" step="0.01"></div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" id="btnFecharCaixa">Fechar caixa</button>
          <button class="btn" id="btnResumoWpp">💬 Mandar resumo do dia no WhatsApp</button>
        </div>
        <div id="resultadoFechamento" style="margin-top:14px; font-size:13px;"></div>`;

      function montarTextoResumoDia(diferenca){
        const linha = '- - - - - - - - - - -';
        let texto = `📊 *Resumo do dia — ${nomeLoja(lojaId)}*\n${new Date().toLocaleDateString('pt-BR')}\n${linha}\n`
          + `Abertura de caixa: ${moeda(caixaHoje.VALOR_ABERTURA)}\n\n`
          + `💵 Dinheiro: ${moeda(porForma['Dinheiro'])}\n`
          + `💠 PIX: ${moeda(porForma['PIX'])}\n`
          + `💳 Débito: ${moeda(porForma['Cartão de Débito'])}\n`
          + `💳 Crédito: ${moeda(porForma['Cartão de Crédito'])}\n`
          + `${linha}\n*Total vendido: ${moeda(totalVendidoHoje)}*\n`
          + `Esperado em caixa (dinheiro): ${moeda(esperadoEmCaixa)}`;
        if (diferenca !== undefined && !isNaN(diferenca)) {
          texto += `\n${linha}\n` + (diferenca === 0 ? '✅ Caixa bateu certinho!' : diferenca > 0 ? `🔵 Sobrou ${moeda(diferenca)} no caixa.` : `🔴 Faltou ${moeda(Math.abs(diferenca))} no caixa.`);
        }
        return texto;
      }

      async function copiarResumoParaAreaTransferencia(texto){
        try { await navigator.clipboard.writeText(texto); mostrarToast('Resumo copiado — já pode colar onde quiser.'); }
        catch (e) { mostrarToast('Não consegui copiar automaticamente. Copia manualmente o texto que apareceu.', 'erro'); }
      }

      document.getElementById('btnResumoWpp').addEventListener('click', () => {
        window.open('https://wa.me/?text=' + encodeURIComponent(montarTextoResumoDia()), '_blank');
      });

      document.getElementById('btnFecharCaixa').addEventListener('click', async () => {
        const contado = Number(document.getElementById('valorContado').value);
        if (isNaN(contado)){ mostrarToast('Informe o valor contado.', 'erro'); return; }
        const diferenca = contado - esperadoEmCaixa;
        try {
          if (!(await checarPermissao('CAIXA','EDITAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
          await dbUpdate('CAIXA', idDia, { STATUS: 'Fechado', VALOR_ESPERADO: esperadoEmCaixa, VALOR_CONTADO: contado, DIFERENCA: diferenca, USUARIO_FECHAMENTO: usuarioAtual.ID, DATA_FECHAMENTO: new Date().toISOString() });
          const cor = diferenca === 0 ? 'var(--mint)' : (diferenca > 0 ? 'var(--blue)' : 'var(--red)');
          const textoResultado = diferenca === 0 ? 'Caixa bateu certinho! 🎉' : (diferenca > 0 ? `Sobrou ${moeda(diferenca)} no caixa.` : `Faltou ${moeda(Math.abs(diferenca))} no caixa.`);
          const textoResumo = montarTextoResumoDia(diferenca);

          setHTML('resultadoFechamento', `<b style="color:${cor};">${textoResultado}</b><p style="color:var(--text-tertiary); font-size:11.5px; margin-top:8px;" id="statusEnvioTelegram">Enviando resumo pro Telegram…</p><button class="btn" style="margin-top:6px;" id="btnCopiarResumo">📋 Copiar resumo do dia</button>`);
          document.getElementById('btnCopiarResumo').addEventListener('click', () => copiarResumoParaAreaTransferencia(textoResumo));
          mostrarToast('Caixa fechado.');

          // Manda pro Telegram sozinho, se já tiver configurado em Configurações — se não
          // tiver, ou der erro, o botão de copiar acima já resolve na mesma hora.
          try {
            const cfgTelegram = await dbGetById('CONFIG', 'telegram_resumo_caixa');
            const statusEl = document.getElementById('statusEnvioTelegram');
            if (cfgTelegram && cfgTelegram.BOT_TOKEN && cfgTelegram.CHAT_ID) {
              const resultado = await window.enviarMensagemTelegram(cfgTelegram.BOT_TOKEN, cfgTelegram.CHAT_ID, textoResumo);
              if (statusEl) { statusEl.textContent = resultado.ok ? '✓ Resumo enviado pro Telegram.' : 'Não consegui enviar pro Telegram — usa o botão de copiar acima.'; statusEl.style.color = resultado.ok ? 'var(--mint)' : 'var(--amber)'; }
            } else if (statusEl) {
              statusEl.textContent = 'Telegram não configurado ainda (Configurações → Telegram) — usa o botão de copiar acima.';
              statusEl.style.color = 'var(--text-tertiary)';
            }
          } catch (e) {
            const statusEl = document.getElementById('statusEnvioTelegram');
            if (statusEl) { statusEl.textContent = 'Não consegui enviar pro Telegram — usa o botão de copiar acima.'; statusEl.style.color = 'var(--amber)'; }
          }
        } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
      });
    } catch (e) { el.textContent = 'Erro: ' + e.message; }
  }

  carregarCaixa();
})();
</script>
