<style>
  .modal-overlay{ position:fixed; inset:0; background:rgba(3,5,8,0.6); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:14px; width:100%; max-width:520px; }
  .modal-head{ display:flex; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--hairline); }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--hairline); }
  .ffield{ margin-bottom:14px; }
  .ffield label{ display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .ffield input, .ffield select, .ffield textarea{ width:100%; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:10px 12px; border-radius:8px; font-size:13px; font-family:inherit; box-sizing:border-box; }
  .frow2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .frow4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }
  @media (max-width:700px){ .frow4{ grid-template-columns:1fr 1fr; } }
  .modal-close{ background:none; border:none; color:var(--text-tertiary); font-size:18px; cursor:pointer; }
  .filtros{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
  .filtros .grupo{ display:flex; flex-direction:column; gap:4px; }
  .filtros .grupo span{ font-size:10.5px; color:var(--text-tertiary); }
  .filtros select, .filtros input{ background:var(--bg-surface); border:1px solid var(--hairline); color:var(--text-primary); padding:8px 12px; border-radius:8px; font-size:12.5px; }
</style>

<div class="toolbar">
  <div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Controle de Ponto</h1>
  <p style="color:var(--text-secondary); font-size:13px; margin:0;">Registro manual de entrada, saída e almoço de cada funcionário — pra fechar a folha de pagamento.</p></div>
  <button class="btn btn-primary" id="btnNovo">+ Registrar ponto</button>
</div>

<div class="filtros">
  <div class="grupo"><span>Funcionário</span><select id="filtroFuncionario"><option value="">Todos</option></select></div>
  <div class="grupo"><span>De</span><input type="date" id="filtroDe"></div>
  <div class="grupo"><span>Até</span><input type="date" id="filtroAte"></div>
  <button class="btn" id="btnLimparFiltroPonto" style="padding:8px 12px;">Limpar</button>
  <button class="btn btn-primary" id="btnGerarPdfFuncionario" style="margin-left:auto;">⬇️ Gerar PDF do funcionário</button>
</div>

<div class="kpi-grid" style="margin-bottom:20px;">
  <div class="kpi"><div class="lbl">Dias registrados</div><div class="val" id="kpiDias">—</div></div>
  <div class="kpi"><div class="lbl">Total de horas</div><div class="val" id="kpiHoras">—</div></div>
  <div class="kpi"><div class="lbl">Média por dia</div><div class="val" id="kpiMedia">—</div></div>
</div>

<table class="dt">
  <thead><tr><th>Data</th><th>Funcionário</th><th>Entrada</th><th>Início almoço</th><th>Fim almoço</th><th>Saída</th><th>Horas</th><th></th></tr></thead>
  <tbody id="linhas"><tr class="empty-row"><td colspan="8">Carregando…</td></tr></tbody>
</table>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitulo" style="font-family:var(--font-display); margin:0;">Registrar ponto</h3><button class="modal-close" id="fecharModal">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="frow2">
        <div class="ffield"><label>Funcionário *</label><select id="fFuncionario"></select></div>
        <div class="ffield"><label>Data *</label><input id="fData" type="date"></div>
      </div>
      <div class="frow4">
        <div class="ffield"><label>Entrada</label><input id="fEntrada" type="time"></div>
        <div class="ffield"><label>Início almoço</label><input id="fInicioAlmoco" type="time"></div>
        <div class="ffield"><label>Fim almoço</label><input id="fFimAlmoco" type="time"></div>
        <div class="ffield"><label>Saída</label><input id="fSaida" type="time"></div>
      </div>
      <div id="previaHoras" style="font-size:12.5px; color:var(--mint); font-weight:600; margin-bottom:14px;"></div>
      <div class="ffield"><label>Observações</label><textarea id="fObs" style="min-height:60px;" placeholder="Ex.: falta justificada, hora extra autorizada..."></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" id="btnCancelar">Cancelar</button><button class="btn btn-primary" id="btnSalvar">Salvar</button></div>
  </div>
</div>

<script>
(async function(){
  let registros = [], registrosFiltrados = [], funcionarios = [], empresas = [];
  let registroAtual = null;

  function moeda(v){ return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
  function dataBR(v){ return v ? new Date(v+'T00:00:00').toLocaleDateString('pt-BR') : '—'; }
  function nomeFuncionario(id){ const f = funcionarios.find(x=>x.ID===id); return f?f.NOME:'—'; }
  function horaOuTraco(v){ return v || '—'; }

  /** Calcula horas trabalhadas: (saída - entrada) menos o intervalo de almoço, se informado. */
  function calcularHoras(entrada, saida, inicioAlmoco, fimAlmoco){
    if (!entrada || !saida) return 0;
    const paraMinutos = (hhmm) => { const [h,m] = hhmm.split(':').map(Number); return h*60+m; };
    let minutos = paraMinutos(saida) - paraMinutos(entrada);
    if (inicioAlmoco && fimAlmoco) minutos -= (paraMinutos(fimAlmoco) - paraMinutos(inicioAlmoco));
    return Math.max(0, minutos / 60);
  }
  function formatarHoras(h){
    const horas = Math.floor(h);
    const minutos = Math.round((h - horas) * 60);
    return horas + 'h' + String(minutos).padStart(2,'0');
  }

  async function carregar(){
    try {
      if (!(await checarPermissao('FUNCIONARIOS','VISUALIZAR'))){ setHTML('linhas', '<tr class="empty-row"><td colspan="8">Sem permissão.</td></tr>'); return; }
      [registros, funcionarios, empresas] = await Promise.all([dbGetAll('PONTO_REGISTROS'), dbGetAll('USUARIOS'), dbGetAll('EMPRESAS')]);
      funcionarios = funcionarios.filter(f => f.STATUS !== 'Excluído');

      const opcoesFuncionario = funcionarios.map(f => `<option value="${f.ID}">${f.NOME}</option>`).join('');
      setHTML('filtroFuncionario', '<option value="">Todos</option>' + opcoesFuncionario);
      setHTML('fFuncionario', opcoesFuncionario);

      aplicarFiltros();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  function aplicarFiltros(){
    const funcId = document.getElementById('filtroFuncionario').value;
    const de = document.getElementById('filtroDe').value;
    const ate = document.getElementById('filtroAte').value;
    registrosFiltrados = registros.filter(r => {
      if (funcId && r.FUNCIONARIO_ID !== funcId) return false;
      if (de && r.DATA < de) return false;
      if (ate && r.DATA > ate) return false;
      return true;
    }).sort((a,b) => b.DATA.localeCompare(a.DATA));
    renderKpis();
    renderLinhas();
  }
  ['filtroFuncionario','filtroDe','filtroAte'].forEach(id => document.getElementById(id).addEventListener('change', aplicarFiltros));
  document.getElementById('btnLimparFiltroPonto').addEventListener('click', () => {
    document.getElementById('filtroFuncionario').value = ''; document.getElementById('filtroDe').value = ''; document.getElementById('filtroAte').value = '';
    aplicarFiltros();
  });

  function renderKpis(){
    const totalHoras = registrosFiltrados.reduce((s,r) => s + Number(r.HORAS_TRABALHADAS||0), 0);
    document.getElementById('kpiDias').textContent = registrosFiltrados.length;
    document.getElementById('kpiHoras').textContent = formatarHoras(totalHoras);
    document.getElementById('kpiMedia').textContent = registrosFiltrados.length ? formatarHoras(totalHoras / registrosFiltrados.length) : '—';
  }

  function renderLinhas(){
    if (!registrosFiltrados.length){ setHTML('linhas', '<tr class="empty-row"><td colspan="8">Nenhum registro de ponto ainda.</td></tr>'); return; }
    setHTML('linhas', registrosFiltrados.map(r => `<tr>
      <td>${dataBR(r.DATA)}</td><td>${nomeFuncionario(r.FUNCIONARIO_ID)}</td>
      <td>${horaOuTraco(r.HORA_ENTRADA)}</td><td>${horaOuTraco(r.HORA_INICIO_ALMOCO)}</td><td>${horaOuTraco(r.HORA_FIM_ALMOCO)}</td><td>${horaOuTraco(r.HORA_SAIDA)}</td>
      <td><b>${formatarHoras(r.HORAS_TRABALHADAS||0)}</b></td>
      <td style="display:flex; gap:6px;">
        <button class="btn" style="padding:6px 10px; font-size:11.5px;" onclick="window.__editarPonto('${r.ID}')">Editar</button>
        <button class="btn" style="padding:6px 10px; font-size:11.5px; color:var(--red);" onclick="window.__excluirPonto('${r.ID}')">Excluir</button>
      </td></tr>`).join(''));
  }

  // ---------- Modal ----------
  const modal = document.getElementById('modal');
  function atualizarPreviaHoras(){
    const h = calcularHoras(document.getElementById('fEntrada').value, document.getElementById('fSaida').value, document.getElementById('fInicioAlmoco').value, document.getElementById('fFimAlmoco').value);
    document.getElementById('previaHoras').textContent = h > 0 ? '≈ ' + formatarHoras(h) + ' trabalhadas nesse dia' : '';
  }
  ['fEntrada','fSaida','fInicioAlmoco','fFimAlmoco'].forEach(id => document.getElementById(id).addEventListener('input', atualizarPreviaHoras));

  document.getElementById('btnNovo').addEventListener('click', () => {
    registroAtual = null;
    document.getElementById('modalTitulo').textContent = 'Registrar ponto';
    document.getElementById('fId').value = '';
    document.getElementById('fFuncionario').value = document.getElementById('filtroFuncionario').value || (funcionarios[0] && funcionarios[0].ID) || '';
    document.getElementById('fData').value = new Date().toISOString().substring(0,10);
    ['fEntrada','fInicioAlmoco','fFimAlmoco','fSaida','fObs'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('previaHoras').textContent = '';
    modal.classList.add('open');
  });
  document.getElementById('fecharModal').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('btnCancelar').addEventListener('click', () => modal.classList.remove('open'));

  window.__editarPonto = (id) => {
    registroAtual = registros.find(r => r.ID === id);
    if (!registroAtual) return;
    document.getElementById('modalTitulo').textContent = 'Editar ponto — ' + dataBR(registroAtual.DATA);
    document.getElementById('fId').value = registroAtual.ID;
    document.getElementById('fFuncionario').value = registroAtual.FUNCIONARIO_ID;
    document.getElementById('fData').value = registroAtual.DATA;
    document.getElementById('fEntrada').value = registroAtual.HORA_ENTRADA || '';
    document.getElementById('fInicioAlmoco').value = registroAtual.HORA_INICIO_ALMOCO || '';
    document.getElementById('fFimAlmoco').value = registroAtual.HORA_FIM_ALMOCO || '';
    document.getElementById('fSaida').value = registroAtual.HORA_SAIDA || '';
    document.getElementById('fObs').value = registroAtual.OBSERVACOES || '';
    atualizarPreviaHoras();
    modal.classList.add('open');
  };

  document.getElementById('btnSalvar').addEventListener('click', async () => {
    const funcionarioId = document.getElementById('fFuncionario').value;
    const data = document.getElementById('fData').value;
    if (!funcionarioId || !data){ mostrarToast('Escolha o funcionário e a data.', 'erro'); return; }

    const entrada = document.getElementById('fEntrada').value;
    const saida = document.getElementById('fSaida').value;
    const inicioAlmoco = document.getElementById('fInicioAlmoco').value;
    const fimAlmoco = document.getElementById('fFimAlmoco').value;
    const horas = calcularHoras(entrada, saida, inicioAlmoco, fimAlmoco);

    const dados = {
      FUNCIONARIO_ID: funcionarioId, DATA: data,
      HORA_ENTRADA: entrada, HORA_SAIDA: saida, HORA_INICIO_ALMOCO: inicioAlmoco, HORA_FIM_ALMOCO: fimAlmoco,
      HORAS_TRABALHADAS: horas, OBSERVACOES: document.getElementById('fObs').value.trim()
    };

    try {
      if (registroAtual) {
        if (!(await checarPermissao('FUNCIONARIOS','EDITAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
        await dbUpdate('PONTO_REGISTROS', registroAtual.ID, dados);
      } else {
        if (!(await checarPermissao('FUNCIONARIOS','CADASTRAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
        await dbInsert('PONTO_REGISTROS', Object.assign({ USUARIO_REGISTRO_ID: usuarioAtual.ID }, dados));
      }
      mostrarToast('Ponto salvo.');
      modal.classList.remove('open');
      carregar();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  });

  window.__excluirPonto = async (id) => {
    if (!confirm('Excluir esse registro de ponto?')) return;
    try {
      if (!(await checarPermissao('FUNCIONARIOS','EXCLUIR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
      await dbDelete('PONTO_REGISTROS', id);
      mostrarToast('Registro excluído.');
      carregar();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  };

  // ---------- Gerar PDF do funcionário (resumo pra folha de pagamento) ----------
  document.getElementById('btnGerarPdfFuncionario').addEventListener('click', async () => {
    const funcId = document.getElementById('filtroFuncionario').value;
    if (!funcId){ mostrarToast('Escolha um funcionário no filtro acima antes de gerar o PDF.', 'erro'); return; }
    const funcionario = funcionarios.find(f => f.ID === funcId);
    const registrosDoFunc = registrosFiltrados.filter(r => r.FUNCIONARIO_ID === funcId).sort((a,b) => a.DATA.localeCompare(b.DATA));
    if (!registrosDoFunc.length){ mostrarToast('Nenhum registro desse funcionário no período filtrado.', 'erro'); return; }

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      let y = await desenharCabecalhoLoja(doc, empresas);

      doc.setFontSize(15); doc.setFont(undefined,'bold'); doc.setTextColor(20);
      doc.text('RESUMO DE PONTO — ' + funcionario.NOME, 105, y+4, { align:'center' }); y += 12;

      const de = document.getElementById('filtroDe').value, ate = document.getElementById('filtroAte').value;
      doc.setFontSize(9.5); doc.setFont(undefined,'normal'); doc.setTextColor(100);
      doc.text('Período: ' + (de?dataBR(de):'início') + ' até ' + (ate?dataBR(ate):'hoje'), 20, y); y += 8;

      doc.setDrawColor(220); doc.setFontSize(9); doc.setFont(undefined,'bold'); doc.setTextColor(20);
      doc.text('Data', 20, y); doc.text('Entrada', 55, y); doc.text('Almoço', 80, y); doc.text('Saída', 115, y); doc.text('Horas', 145, y); doc.text('Obs.', 165, y);
      y += 2; doc.line(20, y, 190, y); y += 5;

      doc.setFont(undefined,'normal');
      registrosDoFunc.forEach(r => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(dataBR(r.DATA), 20, y);
        doc.text(horaOuTraco(r.HORA_ENTRADA), 55, y);
        doc.text((r.HORA_INICIO_ALMOCO||'—') + '-' + (r.HORA_FIM_ALMOCO||'—'), 80, y);
        doc.text(horaOuTraco(r.HORA_SAIDA), 115, y);
        doc.text(formatarHoras(r.HORAS_TRABALHADAS||0), 145, y);
        if (r.OBSERVACOES) doc.text(doc.splitTextToSize(r.OBSERVACOES, 28)[0] || '', 165, y);
        y += 6;
      });

      const totalHoras = registrosDoFunc.reduce((s,r) => s + Number(r.HORAS_TRABALHADAS||0), 0);
      y += 4; doc.line(20, y, 190, y); y += 7;
      doc.setFontSize(11); doc.setFont(undefined,'bold');
      doc.text('Total: ' + registrosDoFunc.length + ' dia(s) trabalhado(s) — ' + formatarHoras(totalHoras) + ' no período', 20, y);

      doc.save('Ponto_' + funcionario.NOME.replace(/\s+/g,'_') + '.pdf');
      mostrarToast('PDF gerado.');
    } catch (e) { mostrarToast('Erro ao gerar PDF: ' + e.message, 'erro'); }
  });

  carregar();
})();
</script>
