<style>
  .pdv-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:18px; align-items:start; }
  @media (max-width: 980px){ .pdv-grid{ grid-template-columns:1fr; } }
  .card{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; padding:18px 20px; }
  .dropdown-results{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--bg-elevated); border:1px solid var(--hairline);
    border-radius:10px; max-height:240px; overflow-y:auto; z-index:15; display:none; }
  .dropdown-results.open{ display:block; }
  .dropdown-results .opt{ padding:10px 12px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--hairline); }
  .dropdown-results .opt:hover{ background:var(--bg-surface); }
  .ffield{ margin-bottom:14px; position:relative; }
  .ffield label{ display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .ffield input, .ffield select{ width:100%; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:10px 12px; border-radius:8px; font-size:13px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-secondary); padding:5px 0; }
  .summary-row.total{ font-size:16px; color:var(--text-primary); font-weight:700; font-family:var(--font-display); border-top:1px solid var(--hairline); margin-top:8px; padding-top:12px; }
  .selected-client{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-elevated); border:1px solid var(--hairline); border-radius:8px; padding:9px 12px; font-size:12.5px; }
  .selected-client button{ background:none; border:none; color:var(--text-tertiary); cursor:pointer; }
</style>

<div class="toolbar">
  <div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Vendas (PDV)</h1></div>
  <div class="ffield" style="margin:0; min-width:200px;">
    <label style="font-size:11px; color:var(--text-secondary); display:block; margin-bottom:4px;">Vendendo para a loja:</label>
    <select id="fEmpresaVenda"><option value="">Selecione a loja…</option></select>
  </div>
</div>

<div class="pdv-grid">
  <div class="card">
    <div class="ffield">
      <label>Buscar produto ou OS (nome, SKU, código de barras ou número da OS)</label>
      <input id="buscaProduto" placeholder="Nome, SKU, código de barras ou nº da OS…" autocomplete="off">
      <div class="dropdown-results" id="resultadosProduto"></div>
    </div>
    <table class="dt" style="margin-top:16px;">
      <thead><tr><th>Item</th><th style="width:120px;">Qtd.</th><th style="width:90px;">Preço</th></tr></thead>
      <tbody id="carrinho"><tr class="empty-row"><td colspan="3">Carrinho vazio.</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="ffield">
      <label>Cliente</label>
      <div id="clienteSelecionadoWrap" style="display:none; margin-bottom:8px;">
        <div class="selected-client"><span id="clienteSelecionadoNome"></span><button id="btnRemoverCliente">trocar</button></div>
        <div id="avisoFidelidade" style="display:none; margin-top:8px; padding:8px 10px; border-radius:8px; background:rgba(47,225,168,0.1); border:1px solid rgba(47,225,168,0.3); font-size:12px;"></div>
      </div>
      <input id="buscaCliente" placeholder="Buscar cliente (opcional)…" autocomplete="off">
      <div class="dropdown-results" id="resultadosCliente"></div>
    </div>
    <div class="ffield"><label>Forma de pagamento</label>
      <select id="formaPagamento"><option>PIX</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Dinheiro</option><option>Parcelado</option></select>
    </div>
    <div class="ffield" id="parcelasWrap" style="display:none;"><label>Parcelas</label><input id="parcelas" type="number" min="1" max="12" value="1"></div>
    <div class="ffield" id="dinheiroWrap" style="display:none;">
      <label>Valor recebido do cliente (R$)</label><input id="valorRecebido" type="number" step="0.01">
      <div id="trocoInfo" style="margin-top:8px; font-size:12.5px; font-family:var(--font-mono);"></div>
    </div>

    <div class="ffield">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="chkCombinarPagamento"> Combinar pagamento (dividir entre formas)
      </label>
    </div>

    <div id="combinarWrap" style="display:none; margin-bottom:14px;">
      <div id="linhasCombinado"></div>
      <button class="btn" type="button" id="btnAddFormaPagamento" style="width:100%; justify-content:center; margin-top:6px;">+ Adicionar forma de pagamento</button>
      <div id="avisoCombinado" style="margin-top:8px; font-size:12px; font-family:var(--font-mono);"></div>
    </div>

    <div class="ffield"><label>Desconto geral (R$)</label><input id="desconto" type="number" step="0.01" value="0"></div>

    <div class="summary-row"><span>Subtotal</span><span id="resSubtotal">R$ 0,00</span></div>
    <div class="summary-row"><span>Desconto</span><span id="resDesconto">R$ 0,00</span></div>
    <div class="summary-row total"><span>Total</span><span id="resTotal">R$ 0,00</span></div>

    <button class="btn btn-primary" style="width:100%; margin-top:16px; justify-content:center;" id="btnFinalizar">Finalizar venda</button>
    <div id="notaFiscalWrap" style="display:none; margin-top:12px; padding:12px; border-radius:8px; background:rgba(47,225,168,0.08); border:1px solid rgba(47,225,168,0.3); text-align:center;">
      <div style="font-size:12.5px; color:var(--mint); font-weight:600; margin-bottom:8px;">✅ Venda concluída!</div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" id="btnEnviarNotaWpp">💬 Enviar nota via WhatsApp</button>
    </div>
  </div>
</div>

<div class="card" style="margin-top:20px;">
  <div class="toolbar" style="margin-bottom:12px;">
    <h3 style="font-family:var(--font-display); font-size:15px; margin:0;">Vendas recentes</h3>
    <input id="buscaHistorico" placeholder="Buscar por cliente ou vendedor…" style="max-width:220px; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:7px 10px; border-radius:8px; font-size:12px;">
  </div>
  <table class="dt">
    <thead><tr><th>Data/Hora</th><th>Cliente</th><th>Vendedor</th><th>Loja</th><th>Pagamento</th><th>Valor</th><th>Status</th><th></th></tr></thead>
    <tbody id="linhasHistorico"><tr class="empty-row"><td colspan="8">Carregando…</td></tr></tbody>
  </table>
</div>

<script>
(async function(){
  let carrinho = [];
  let clienteSelecionado = null;
  let produtosDaLoja = [], todosClientes = [];
  let ultimaVendaParaNota = null;
  let empresasCarregadas = [];
  let configFidelidade = { ATIVO: false, VALOR_MINIMO: 0, PERCENTUAL_DESCONTO: 0 };

  function moeda(v){ return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }

  /** Soma tudo que já foi pago dessa OS (pode ter vários pagamentos parciais). */
  function valorPagoOS(os){
    try { return (JSON.parse(os.PAGAMENTOS_OS || '[]')).reduce((s,p) => s + Number(p.valor||0), 0); } catch(e) { return 0; }
  }
  /** Quanto ainda falta pagar dessa OS. */
  function saldoPendenteOS(os){ return Math.max(0, Number(os.VALOR_SERVICO||0) - valorPagoOS(os)); }

  let todosProdutosCarregados = [];
  let osEmAberto = [];
  try {
    todosProdutosCarregados = (await dbGetAll('PRODUTOS')).filter(p => p.STATUS !== 'Excluído');
    todosClientes = (await dbGetAll('CLIENTES')).filter(c => c.STATUS !== 'Excluído');
    empresasCarregadas = await dbGetAll('EMPRESAS');
    osEmAberto = (await dbGetAll('ASSISTENCIAS')).filter(o => saldoPendenteOS(o) > 0);

    const selEmpresa = document.getElementById('fEmpresaVenda');
    if (window.lojaAtivaId) {
      // Filtro geral já define uma loja específica — trava o seletor nela.
      setHTML('fEmpresaVenda', empresasCarregadas.map(e => `<option value="${e.ID}" ${e.ID===window.lojaAtivaId?'selected':''}>${e.NOME}</option>`).join(''));
      selEmpresa.disabled = true;
    } else {
      setHTML('fEmpresaVenda', '<option value="">Selecione a loja…</option>' + empresasCarregadas.map(e => `<option value="${e.ID}">${e.NOME}</option>`).join(''));
    }
    atualizarProdutosDaLoja();
    document.getElementById('fEmpresaVenda').addEventListener('change', atualizarProdutosDaLoja);

    const cfgFid = await dbGetById('CONFIG', 'desconto_fidelidade');
    if (cfgFid) configFidelidade = cfgFid;
  } catch (e) { mostrarToast('Erro ao carregar dados: ' + e.message, 'erro'); }

  function atualizarProdutosDaLoja(){
    const lojaEscolhida = document.getElementById('fEmpresaVenda').value;
    produtosDaLoja = lojaEscolhida ? todosProdutosCarregados.filter(p => p.EMPRESA_ID === lojaEscolhida) : [];
  }

  // ---------- Busca de produto (e também Ordens de Serviço em aberto) ----------
  const inputProduto = document.getElementById('buscaProduto');
  const resProduto = document.getElementById('resultadosProduto');
  inputProduto.addEventListener('input', () => {
    const termo = inputProduto.value.trim().toLowerCase();
    if (termo.length < 2){ resProduto.classList.remove('open'); return; }
    const listaProdutos = produtosDaLoja.filter(p => p.NOME.toLowerCase().includes(termo) || (p.SKU||'').toLowerCase().includes(termo) || (p.CODIGO_BARRAS||'').toLowerCase().includes(termo)).slice(0, 15);
    const listaOS = osEmAberto.filter(o => (o.NUMERO_OS||'').toLowerCase().includes(termo) || (o.MARCA+' '+o.MODELO).toLowerCase().includes(termo)).slice(0, 8);
    mostrarResultadosProduto(listaProdutos, listaOS);
  });

  function mostrarResultadosProduto(listaProdutos, listaOS){
    if (!listaProdutos.length && !listaOS.length){ resProduto.innerHTML = '<div class="opt">Nada encontrado.</div>'; resProduto.classList.add('open'); return; }

    const htmlOS = listaOS.map(o => {
      const pago = valorPagoOS(o), saldo = saldoPendenteOS(o);
      const legenda = pago > 0 ? `Já pago ${moeda(pago)} · saldo pendente ${moeda(saldo)}` : `Serviço de assistência técnica · valor ${moeda(saldo)}`;
      return `<div class="opt" data-os-id="${o.ID}" style="border-left:3px solid var(--amber);">
      <div>🔧 ${o.NUMERO_OS} — ${o.MARCA||''} ${o.MODELO||''} ${pago>0 ? '<span style="color:var(--amber); font-size:10px;">· parcial</span>' : ''}</div>
      <div style="color:var(--text-tertiary); font-size:11px;">${legenda}</div>
    </div>`;
    }).join('');
    const htmlProdutos = listaProdutos.map(p => `<div class="opt" data-id="${p.ID}"><div>${p.NOME}</div><div style="color:var(--text-tertiary); font-size:11px;">${moeda(p.PRECO_VENDA)} · estoque ${p.ESTOQUE_ATUAL}</div></div>`).join('');

    resProduto.innerHTML = htmlOS + htmlProdutos;
    resProduto.classList.add('open');
    resProduto.querySelectorAll('.opt[data-id]').forEach(el => el.addEventListener('click', () => {
      adicionarAoCarrinho(listaProdutos.find(p => p.ID === el.getAttribute('data-id')));
      inputProduto.value = ''; resProduto.classList.remove('open');
    }));
    resProduto.querySelectorAll('.opt[data-os-id]').forEach(el => el.addEventListener('click', () => {
      adicionarOSAoCarrinho(listaOS.find(o => o.ID === el.getAttribute('data-os-id')));
      inputProduto.value = ''; resProduto.classList.remove('open');
    }));
  }

  /**
   * Confere se dá pra aumentar a quantidade sem passar do estoque. Se passar,
   * pergunta se quer vender mesmo assim — e se disser que sim, registra a
   * divergência na aba administrativa, pra não sumir sem rastro.
   */
  async function podeUsarQuantidade(produto, quantidadeDesejada){
    const disponivel = Number(produto.ESTOQUE_ATUAL) || 0;
    if (quantidadeDesejada <= disponivel) return true;

    const confirma = confirm(`Em estoque só tem ${disponivel} unidade(s) de "${produto.NOME}".\nDeseja vender ${quantidadeDesejada} mesmo assim?`);
    if (!confirma) return false;

    try {
      await dbInsert('DIVERGENCIAS_ESTOQUE', {
        PRODUTO_ID: produto.ID, NOME_PRODUTO: produto.NOME, EMPRESA_ID: produto.EMPRESA_ID||'',
        ESTOQUE_DISPONIVEL: disponivel, QUANTIDADE_SOLICITADA: quantidadeDesejada, DIFERENCA: quantidadeDesejada - disponivel,
        USUARIO_ID: usuarioAtual.ID, DATA: new Date().toISOString()
      });
    } catch (e) { console.error('Erro ao registrar divergência de estoque:', e); }
    return true;
  }

  async function adicionarAoCarrinho(produto){
    const existente = carrinho.find(i => i.PRODUTO_ID === produto.ID);
    const novaQuantidade = existente ? existente.QUANTIDADE + 1 : 1;
    if (!(await podeUsarQuantidade(produto, novaQuantidade))) return;
    if (existente) existente.QUANTIDADE = novaQuantidade;
    else carrinho.push({ PRODUTO_ID: produto.ID, NOME: produto.NOME, QUANTIDADE: 1, PRECO_UNITARIO: Number(produto.PRECO_VENDA) });
    renderCarrinho();
  }

  /** Coloca uma Ordem de Serviço no carrinho, como se fosse um "produto" — mas sem mexer em estoque, com preço editável (cada OS tem o seu). */
  function adicionarOSAoCarrinho(os){
    if (carrinho.some(i => i.OS_ID === os.ID)){ mostrarToast('Essa OS já está no carrinho.', 'erro'); return; }
    carrinho.push({
      TIPO: 'SERVICO', OS_ID: os.ID, PRODUTO_ID: null,
      NOME: 'OS ' + os.NUMERO_OS + ' — ' + (os.MARCA||'') + ' ' + (os.MODELO||''),
      QUANTIDADE: 1, PRECO_UNITARIO: saldoPendenteOS(os)
    });

    // Traz o cliente já vinculado na OS, pra não precisar buscar de novo.
    if (os.CLIENTE_ID) {
      const clienteDaOS = todosClientes.find(c => c.ID === os.CLIENTE_ID);
      if (clienteDaOS && (!clienteSelecionado || clienteSelecionado.ID !== clienteDaOS.ID)) {
        const trocandoCliente = !!clienteSelecionado;
        clienteSelecionado = clienteDaOS;
        document.getElementById('clienteSelecionadoNome').textContent = clienteDaOS.NOME;
        document.getElementById('clienteSelecionadoWrap').style.display = 'block';
        document.getElementById('buscaCliente').style.display = 'none';
        document.getElementById('buscaCliente').value = '';
        if (trocandoCliente) mostrarToast('Cliente trocado pra "' + clienteDaOS.NOME + '" (é quem está vinculado a essa OS).');
        verificarFidelidade();
      }
    }

    renderCarrinho();
  }
  window.__alterarPrecoServico = (idx, valor) => {
    const item = carrinho[idx];
    const osOrigem = osEmAberto.find(o => o.ID === item.OS_ID);
    const saldoMax = osOrigem ? saldoPendenteOS(osOrigem) : Number(valor)||0;
    let novoValor = Number(valor) || 0;
    if (novoValor > saldoMax) { novoValor = saldoMax; mostrarToast('Não dá pra cobrar mais que o saldo pendente dessa OS (' + moeda(saldoMax) + ').', 'erro'); }
    item.PRECO_UNITARIO = novoValor;
    renderCarrinho();
  };

  function renderCarrinho(){
    const tbody = document.getElementById('carrinho');
    if (!carrinho.length){ tbody.innerHTML = '<tr class="empty-row"><td colspan="3">Carrinho vazio.</td></tr>'; }
    else {
      tbody.innerHTML = carrinho.map((i, idx) => {
        if (i.TIPO === 'SERVICO') {
          const osOrigem = osEmAberto.find(o => o.ID === i.OS_ID);
          const saldoTotal = osOrigem ? saldoPendenteOS(osOrigem) : i.PRECO_UNITARIO;
          return `<tr style="background:rgba(245,166,35,0.06);">
            <td>${i.NOME} <button style="background:none;border:none;color:var(--text-tertiary);cursor:pointer;" onclick="window.__removerItem(${idx})">✕</button>
              <div style="font-size:10px; color:var(--text-tertiary); margin-top:2px;">Saldo da OS: ${moeda(saldoTotal)} — pode digitar menos pra registrar só um pagamento parcial</div>
            </td>
            <td style="color:var(--text-tertiary); font-size:11px;">Serviço (1x)</td>
            <td><input type="number" step="0.01" value="${i.PRECO_UNITARIO}" style="width:90px; background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:5px 8px; border-radius:6px;" onchange="window.__alterarPrecoServico(${idx}, this.value)"></td>
          </tr>`;
        }
        return `<tr>
          <td>${i.NOME} <button style="background:none;border:none;color:var(--text-tertiary);cursor:pointer;" onclick="window.__removerItem(${idx})">✕</button></td>
          <td><button onclick="window.__alterarQtd(${idx},-1)">−</button> ${i.QUANTIDADE} <button onclick="window.__alterarQtd(${idx},1)">+</button></td>
          <td>${moeda(i.QUANTIDADE * i.PRECO_UNITARIO)}</td></tr>`;
      }).join('');
    }
    atualizarResumo(); atualizarTroco(); atualizarValidacaoCombinado();
  }
  window.__removerItem = (idx) => { carrinho.splice(idx,1); renderCarrinho(); };
  window.__alterarQtd = async (idx, delta) => {
    const item = carrinho[idx];
    const novaQuantidade = Math.max(1, item.QUANTIDADE + delta);
    if (delta > 0) {
      const produto = produtosDaLoja.find(p => p.ID === item.PRODUTO_ID);
      if (produto && !(await podeUsarQuantidade(produto, novaQuantidade))) return;
    }
    item.QUANTIDADE = novaQuantidade;
    renderCarrinho();
  };

  // ---------- Busca de cliente ----------
  const inputCliente = document.getElementById('buscaCliente');
  const resCliente = document.getElementById('resultadosCliente');
  inputCliente.addEventListener('input', () => {
    const termoOriginal = inputCliente.value.trim();
    const termo = termoOriginal.toLowerCase();
    if (termo.length < 2){ resCliente.classList.remove('open'); return; }
    const lista = todosClientes.filter(c => c.NOME.toLowerCase().includes(termo) || (c.CPF||'').includes(termo)).slice(0, 20);

    // Só oferece "cadastrar rápido" quando parece nome e sobrenome (2+ palavras) e ninguém já cadastrado bate exatamente.
    const pareceNomeCompleto = termoOriginal.split(/\s+/).filter(Boolean).length >= 2;
    const jaExisteExato = lista.some(c => c.NOME.toLowerCase() === termo);
    const opcaoCadastrarRapido = (pareceNomeCompleto && !jaExisteExato)
      ? `<div class="opt" data-cadastrar-rapido="1" style="color:var(--mint); font-weight:600;">+ Cadastrar "${termoOriginal}" como novo cliente</div>` : '';

    const opcoesEncontradas = lista.map(c => `<div class="opt" data-id="${c.ID}">${c.NOME}</div>`).join('');
    const semNada = !lista.length && !opcaoCadastrarRapido;
    resCliente.innerHTML = semNada ? '<div class="opt">Nenhum cliente encontrado.</div>' : (opcoesEncontradas + opcaoCadastrarRapido);
    resCliente.classList.add('open');

    resCliente.querySelectorAll('.opt[data-id]').forEach(el => el.addEventListener('click', () => {
      clienteSelecionado = lista.find(c => c.ID === el.getAttribute('data-id'));
      document.getElementById('clienteSelecionadoNome').textContent = clienteSelecionado.NOME;
      document.getElementById('clienteSelecionadoWrap').style.display = 'block';
      inputCliente.style.display = 'none'; inputCliente.value = '';
      resCliente.classList.remove('open');
      verificarFidelidade();
    }));

    const optRapido = resCliente.querySelector('[data-cadastrar-rapido]');
    if (optRapido) optRapido.addEventListener('click', async () => {
      try {
        if (!(await checarPermissao('CLIENTES','CADASTRAR'))){ mostrarToast('Sem permissão pra cadastrar cliente.', 'erro'); return; }
        const novoCliente = await dbInsert('CLIENTES', { NOME: termoOriginal, VALOR_GASTO_TOTAL: 0, STATUS: 'Ativo' });
        todosClientes.push(novoCliente);
        clienteSelecionado = novoCliente;
        document.getElementById('clienteSelecionadoNome').textContent = novoCliente.NOME;
        document.getElementById('clienteSelecionadoWrap').style.display = 'block';
        inputCliente.style.display = 'none'; inputCliente.value = '';
        resCliente.classList.remove('open');
        mostrarToast('Cliente "' + termoOriginal + '" cadastrado rapidinho — pode completar os dados dele depois em Clientes.');
      } catch (e) { mostrarToast('Erro ao cadastrar cliente: ' + e.message, 'erro'); }
    });
  });
  document.getElementById('btnRemoverCliente').addEventListener('click', () => {
    clienteSelecionado = null;
    document.getElementById('clienteSelecionadoWrap').style.display = 'none';
    document.getElementById('avisoFidelidade').style.display = 'none';
    inputCliente.style.display = 'block';
  });

  function verificarFidelidade(){
    const aviso = document.getElementById('avisoFidelidade');
    if (!configFidelidade.ATIVO || !clienteSelecionado || Number(clienteSelecionado.VALOR_GASTO_TOTAL||0) < Number(configFidelidade.VALOR_MINIMO||0)) {
      aviso.style.display = 'none';
      return;
    }
    aviso.style.display = 'block';
    aviso.innerHTML = `🎉 Cliente fiel! Já gastou ${moeda(clienteSelecionado.VALOR_GASTO_TOTAL)} — elegível a <b>${configFidelidade.PERCENTUAL_DESCONTO}% de desconto</b>. `
      + `<button class="btn" style="padding:4px 8px; font-size:11px; margin-left:4px;" id="btnAplicarFidelidade">Aplicar</button>`;
    document.getElementById('btnAplicarFidelidade').addEventListener('click', () => {
      const subtotal = carrinho.reduce((s,i) => s + i.QUANTIDADE*i.PRECO_UNITARIO, 0);
      const descontoCalculado = subtotal * (Number(configFidelidade.PERCENTUAL_DESCONTO)/100);
      document.getElementById('desconto').value = descontoCalculado.toFixed(2);
      atualizarResumo(); atualizarTroco();
      mostrarToast('Desconto de fidelidade aplicado.');
    });
  }

  // ---------- Pagamento / troco ----------
  document.getElementById('formaPagamento').addEventListener('change', e => {
    document.getElementById('parcelasWrap').style.display = (e.target.value === 'Parcelado' || e.target.value === 'Cartão de Crédito') ? 'block' : 'none';
    document.getElementById('dinheiroWrap').style.display = e.target.value === 'Dinheiro' ? 'block' : 'none';
    atualizarTroco();
  });
  document.getElementById('desconto').addEventListener('input', () => { atualizarResumo(); atualizarTroco(); atualizarValidacaoCombinado(); });
  document.getElementById('valorRecebido').addEventListener('input', atualizarTroco);

  // ---------- Combinar pagamento (dividir entre formas) ----------
  document.getElementById('chkCombinarPagamento').addEventListener('change', e => {
    const combinando = e.target.checked;
    document.getElementById('combinarWrap').style.display = combinando ? 'block' : 'none';
    document.getElementById('formaPagamento').closest('.ffield').style.display = combinando ? 'none' : 'block';
    document.getElementById('parcelasWrap').style.display = combinando ? 'none' : (document.getElementById('formaPagamento').value === 'Parcelado' || document.getElementById('formaPagamento').value === 'Cartão de Crédito' ? 'block' : 'none');
    document.getElementById('dinheiroWrap').style.display = combinando ? 'none' : (document.getElementById('formaPagamento').value === 'Dinheiro' ? 'block' : 'none');
    if (combinando && !document.getElementById('linhasCombinado').children.length) {
      adicionarLinhaCombinado(); adicionarLinhaCombinado();
    }
    atualizarValidacaoCombinado();
  });

  function adicionarLinhaCombinado(){
    const container = document.getElementById('linhasCombinado');
    const div = document.createElement('div');
    div.className = 'linha-combinado';
    div.style.cssText = 'display:flex; gap:6px; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap;';
    div.innerHTML = `
      <select class="combo-forma" style="flex:1.3; min-width:120px;">
        <option>PIX</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Dinheiro</option>
      </select>
      <input class="combo-valor" type="number" step="0.01" placeholder="Valor (R$)" style="flex:1; min-width:90px;">
      <input class="combo-parcelas" type="number" min="1" max="12" value="1" placeholder="Parcelas" style="width:70px; display:none;">
      <button class="btn" type="button" style="padding:8px 10px;" onclick="this.closest('.linha-combinado').remove(); window.__atualizarValidacaoCombinado();">✕</button>
    `;
    container.appendChild(div);
    const selectForma = div.querySelector('.combo-forma');
    const inputParcelas = div.querySelector('.combo-parcelas');
    selectForma.addEventListener('change', () => {
      inputParcelas.style.display = selectForma.value === 'Cartão de Crédito' ? 'inline-block' : 'none';
      atualizarValidacaoCombinado();
    });
    div.querySelector('.combo-valor').addEventListener('input', atualizarValidacaoCombinado);
  }
  document.getElementById('btnAddFormaPagamento').addEventListener('click', adicionarLinhaCombinado);

  function coletarFormasCombinado(){
    return [...document.querySelectorAll('.linha-combinado')].map(l => ({
      forma: l.querySelector('.combo-forma').value,
      valor: Number(l.querySelector('.combo-valor').value) || 0,
      parcelas: l.querySelector('.combo-forma').value === 'Cartão de Crédito' ? (Number(l.querySelector('.combo-parcelas').value) || 1) : 1
    })).filter(f => f.valor > 0);
  }

  function atualizarValidacaoCombinado(){
    if (!document.getElementById('chkCombinarPagamento').checked) return;
    const formas = coletarFormasCombinado();
    const somaFormas = formas.reduce((s,f) => s+f.valor, 0);
    const total = totalDaVenda();
    const diferenca = Math.round((total - somaFormas) * 100) / 100;
    const aviso = document.getElementById('avisoCombinado');
    if (diferenca === 0 && formas.length) {
      aviso.style.color = 'var(--mint)'; aviso.textContent = '✓ Soma bate certinho: ' + moeda(somaFormas) + ' de ' + moeda(total);
    } else if (diferenca > 0) {
      aviso.style.color = 'var(--amber)'; aviso.textContent = 'Falta ' + moeda(diferenca) + ' pra completar o total (' + moeda(total) + ')';
    } else {
      aviso.style.color = 'var(--red)'; aviso.textContent = 'Passou ' + moeda(Math.abs(diferenca)) + ' do total (' + moeda(total) + ')';
    }
  }
  window.__atualizarValidacaoCombinado = atualizarValidacaoCombinado;

  function totalDaVenda(){
    const subtotal = carrinho.reduce((s,i) => s + i.QUANTIDADE*i.PRECO_UNITARIO, 0);
    const desconto = Number(document.getElementById('desconto').value) || 0;
    return Math.max(subtotal - desconto, 0);
  }
  function atualizarResumo(){
    const subtotal = carrinho.reduce((s,i) => s + i.QUANTIDADE*i.PRECO_UNITARIO, 0);
    const desconto = Number(document.getElementById('desconto').value) || 0;
    document.getElementById('resSubtotal').textContent = moeda(subtotal);
    document.getElementById('resDesconto').textContent = moeda(desconto);
    document.getElementById('resTotal').textContent = moeda(Math.max(subtotal-desconto,0));
  }
  function atualizarTroco(){
    const info = document.getElementById('trocoInfo');
    const recebido = Number(document.getElementById('valorRecebido').value);
    if (!recebido && recebido !== 0){ info.textContent=''; return; }
    const total = totalDaVenda();
    if (recebido < total) info.innerHTML = '<span style="color:var(--amber);">Faltam ' + moeda(total-recebido) + '.</span>';
    else info.innerHTML = 'Troco: <span style="color:var(--mint); font-weight:700;">' + moeda(recebido-total) + '</span>';
  }

  // ---------- Finalizar venda ----------
  document.getElementById('btnFinalizar').addEventListener('click', async () => {
    if (!carrinho.length){ mostrarToast('Adicione ao menos um item.', 'erro'); return; }
    if (!document.getElementById('fEmpresaVenda').value){ mostrarToast('Selecione para qual loja é esta venda.', 'erro'); return; }
    if (!(await checarPermissao('VENDAS','CADASTRAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }

    const combinando = document.getElementById('chkCombinarPagamento').checked;
    let formaPagamento = document.getElementById('formaPagamento').value;
    let formasCombinado = [];
    let observacaoTroco = '';

    if (combinando) {
      formasCombinado = coletarFormasCombinado();
      if (!formasCombinado.length){ mostrarToast('Adicione pelo menos uma forma de pagamento.', 'erro'); return; }
      const somaFormas = formasCombinado.reduce((s,f) => s+f.valor, 0);
      const total = totalDaVenda();
      if (Math.round((total - somaFormas) * 100) / 100 !== 0){ mostrarToast('A soma das formas de pagamento precisa bater com o total da venda.', 'erro'); return; }
      formaPagamento = 'Combinado';
    } else if (formaPagamento === 'Dinheiro'){
      const recebido = Number(document.getElementById('valorRecebido').value) || 0;
      const total = totalDaVenda();
      if (recebido < total){ mostrarToast('Valor recebido menor que o total.', 'erro'); return; }
      observacaoTroco = 'Pago em dinheiro: ' + moeda(recebido) + ' | Troco: ' + moeda(recebido-total);
    }

    try {
      document.getElementById('btnFinalizar').disabled = true;
      const desconto = Number(document.getElementById('desconto').value) || 0;
      const valorTotal = totalDaVenda();

      const venda = await dbInsert('VENDAS', {
        CLIENTE_ID: clienteSelecionado ? clienteSelecionado.ID : '', USUARIO_ID: usuarioAtual.ID,
        EMPRESA_ID: document.getElementById('fEmpresaVenda').value,
        DATA: new Date().toISOString(), VALOR_TOTAL: valorTotal, DESCONTO: desconto,
        FORMA_PAGAMENTO: formaPagamento,
        FORMAS_PAGAMENTO_JSON: combinando ? JSON.stringify(formasCombinado) : '',
        PARCELAS: (!combinando && (formaPagamento === 'Parcelado' || formaPagamento === 'Cartão de Crédito')) ? Number(document.getElementById('parcelas').value) : 1,
        OBSERVACOES: observacaoTroco, STATUS: 'Concluída'
      });

      for (const item of carrinho) {
        await dbInsert('ITENS_VENDA', { VENDA_ID: venda.ID, PRODUTO_ID: item.PRODUTO_ID, OS_ID: item.OS_ID||'', QUANTIDADE: item.QUANTIDADE, PRECO_UNITARIO: item.PRECO_UNITARIO });

        // Item de serviço (OS de assistência técnica) — não mexe em estoque, só soma no histórico de pagamentos da OS.
        if (item.TIPO === 'SERVICO') {
          let pagamentosOS = [];
          try {
            const osAtualBanco = await dbGetById('ASSISTENCIAS', item.OS_ID);
            pagamentosOS = JSON.parse((osAtualBanco && osAtualBanco.PAGAMENTOS_OS) || '[]');
          } catch (e) { pagamentosOS = []; }
          pagamentosOS.push({ data: new Date().toISOString(), forma: formaPagamento, valor: item.PRECO_UNITARIO, vendaId: venda.ID });
          await dbUpdate('ASSISTENCIAS', item.OS_ID, { PAGAMENTOS_OS: JSON.stringify(pagamentosOS) });
          continue;
        }

        const produto = produtosDaLoja.find(p => p.ID === item.PRODUTO_ID);
        const novoEstoque = Number(produto.ESTOQUE_ATUAL) - item.QUANTIDADE;
        await dbUpdate('PRODUTOS', produto.ID, { ESTOQUE_ATUAL: novoEstoque });
        produto.ESTOQUE_ATUAL = novoEstoque;
        await dbInsert('MOVIMENTOS_ESTOQUE', { EMPRESA_ID:'', PRODUTO_ID: produto.ID, TIPO:'SAIDA_VENDA', QUANTIDADE: -item.QUANTIDADE, MOTIVO:'Venda '+venda.ID, USUARIO_ID: usuarioAtual.ID, DATA: new Date().toISOString() });

        if (clienteSelecionado) {
          const ehCelular = produto.CATEGORIA === 'Celular';
          await dbInsert('GARANTIAS', {
            VENDA_ID: venda.ID, CLIENTE_ID: clienteSelecionado.ID, PRODUTO_DESCRICAO: produto.NOME,
            NUMERO_GARANTIA: gerarId('GAR'), PRAZO_DIAS: produto.GARANTIA_PADRAO_DIAS || 90,
            TIPO: 'PRODUTO_USADO',
            COR_CAPACIDADE: ehCelular ? [produto.COR, produto.MEMORIA ? produto.MEMORIA+'GB' : ''].filter(Boolean).join(' / ') : '',
            ESTADO_APARELHO: ehCelular ? (produto.ESTADO_APARELHO || 'Aparelho testado com o cliente.') : 'Aparelho em perfeitas condições e testes realizados com o cliente.',
            VALOR_PAGO: item.QUANTIDADE * item.PRECO_UNITARIO, FORMA_PAGAMENTO: formaPagamento,
            DATA_EMISSAO: new Date().toISOString(), STATUS: 'Ativa'
          });
        }
      }

      await dbInsert('FINANCEIRO', {
        TIPO:'Receita', CATEGORIA:'Venda', DESCRICAO:'Venda '+venda.ID, VALOR: valorTotal,
        FORMA_PAGAMENTO: formaPagamento, DATA_VENCIMENTO: new Date().toISOString(), DATA_PAGAMENTO: new Date().toISOString(), STATUS:'Pago',
        ORIGEM_TIPO: 'VENDA', ORIGEM_ID: venda.ID
      });

      if (clienteSelecionado) {
        await dbUpdate('CLIENTES', clienteSelecionado.ID, {
          VALOR_GASTO_TOTAL: (Number(clienteSelecionado.VALOR_GASTO_TOTAL)||0) + valorTotal,
          DATA_ULTIMA_COMPRA: new Date().toISOString()
        });
      }

      mostrarToast('Venda concluída com sucesso!' + (clienteSelecionado ? ' Garantia(s) emitida(s).' : ''));

      const notaFiscalWrap = document.getElementById('notaFiscalWrap');
      if (clienteSelecionado && String(clienteSelecionado.TELEFONE||'').replace(/\D/g,'')) {
        ultimaVendaParaNota = { cliente: clienteSelecionado, itens: carrinho.slice(), venda: Object.assign({}, venda, { FORMA_PAGAMENTO: formaPagamento, VALOR_TOTAL: valorTotal, DESCONTO: desconto, FORMAS_PAGAMENTO: formasCombinado }) };
        notaFiscalWrap.style.display = 'block';
      } else {
        notaFiscalWrap.style.display = 'none';
      }

      const itensServicoDaVenda = carrinho.filter(i => i.TIPO === 'SERVICO');
      for (const item of itensServicoDaVenda) {
        const osAtualizada = await dbGetById('ASSISTENCIAS', item.OS_ID);
        const idx = osEmAberto.findIndex(o => o.ID === item.OS_ID);
        if (osAtualizada && idx !== -1) osEmAberto[idx] = osAtualizada;
      }
      osEmAberto = osEmAberto.filter(o => saldoPendenteOS(o) > 0);

      carrinho = []; clienteSelecionado = null;
      document.getElementById('clienteSelecionadoWrap').style.display='none';
      document.getElementById('buscaCliente').style.display='block';
      document.getElementById('desconto').value = 0; document.getElementById('valorRecebido').value='';
      document.getElementById('chkCombinarPagamento').checked = false;
      document.getElementById('combinarWrap').style.display = 'none';
      document.getElementById('linhasCombinado').innerHTML = '';
      document.getElementById('formaPagamento').closest('.ffield').style.display = 'block';
      document.getElementById('trocoInfo').textContent='';
      renderCarrinho();
      carregarHistorico();
    } catch (e) {
      mostrarToast('Erro ao finalizar venda: ' + e.message, 'erro');
    } finally {
      document.getElementById('btnFinalizar').disabled = false;
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#buscaProduto') && !e.target.closest('#resultadosProduto')) resProduto.classList.remove('open');
    if (!e.target.closest('#buscaCliente') && !e.target.closest('#resultadosCliente')) resCliente.classList.remove('open');
  });

  // ---------- Histórico de vendas + excluir venda errada ----------
  let historicoVendas = [], empresasHistorico = [], usuariosHistorico = [];
  function dataHoraBR(v){ return v ? new Date(v).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—'; }
  function nomeClienteHist(id){ const c = todosClientes.find(x=>x.ID===id); return c?c.NOME:'Sem cliente'; }
  function nomeLojaHist(id){ if (!id) return '—'; const e = empresasHistorico.find(x=>x.ID===id); return e?e.NOME:'—'; }
  function nomeVendedorHist(id){ const u = usuariosHistorico.find(x=>x.ID===id); return u?u.NOME:'—'; }

  async function carregarHistorico(){
    try {
      if (!(await checarPermissao('VENDAS','VISUALIZAR'))){ setHTML('linhasHistorico', '<tr class="empty-row"><td colspan="8">Sem permissão.</td></tr>'); return; }
      empresasHistorico = await dbGetAll('EMPRESAS');
      usuariosHistorico = await dbGetAll('USUARIOS');
      let todas = await dbGetAll('VENDAS');
      if (window.lojaAtivaId) todas = todas.filter(v => v.EMPRESA_ID === window.lojaAtivaId);
      historicoVendas = todas.sort((a,b) => new Date(b.DATA) - new Date(a.DATA)).slice(0, 50);
      renderHistorico(historicoVendas);
    } catch (e) { mostrarToast('Erro ao carregar histórico: ' + e.message, 'erro'); }
  }

  function renderHistorico(lista){
    if (!lista.length){ setHTML('linhasHistorico', '<tr class="empty-row"><td colspan="8">Nenhuma venda ainda.</td></tr>'); return; }
    setHTML('linhasHistorico', lista.map(v => `<tr>
      <td>${dataHoraBR(v.DATA)}</td><td>${nomeClienteHist(v.CLIENTE_ID)}</td><td>${nomeVendedorHist(v.USUARIO_ID)}</td><td>${nomeLojaHist(v.EMPRESA_ID)}</td>
      <td>${v.FORMA_PAGAMENTO||'—'}</td><td>${moeda(v.VALOR_TOTAL)}</td>
      <td><span class="badge ${v.STATUS==='Cancelada'?'neutral':'ok'}">${v.STATUS}</span></td>
      <td>${v.STATUS!=='Cancelada' ? `<button class="btn" style="padding:6px 10px; font-size:11.5px; color:var(--red);" onclick="window.__excluirVenda('${v.ID}')">Excluir</button>` : ''}</td>
      </tr>`).join(''));
  }

  document.getElementById('buscaHistorico').addEventListener('input', e => {
    const t = e.target.value.toLowerCase();
    renderHistorico(historicoVendas.filter(v => nomeClienteHist(v.CLIENTE_ID).toLowerCase().includes(t) || nomeVendedorHist(v.USUARIO_ID).toLowerCase().includes(t)));
  });

  /**
   * Exclui uma venda feita errada: estorna o estoque de cada item, cancela
   * o lançamento no financeiro, desconta o valor do total gasto do cliente,
   * e apaga a venda (e as garantias emitidas por ela).
   */
  window.__excluirVenda = async (vendaId) => {
    if (!confirm('Excluir esta venda? O estoque dos itens será devolvido e o lançamento financeiro cancelado. Essa ação não pode ser desfeita.')) return;
    try {
      if (!(await checarPermissao('VENDAS','EXCLUIR'))){ mostrarToast('Sem permissão.', 'erro'); return; }

      const venda = historicoVendas.find(v => v.ID === vendaId);
      const itensDaVenda = await dbQuery('ITENS_VENDA', { VENDA_ID: vendaId });

      for (const item of itensDaVenda) {
        const produto = await dbGetById('PRODUTOS', item.PRODUTO_ID);
        if (produto) {
          await dbUpdate('PRODUTOS', produto.ID, { ESTOQUE_ATUAL: (Number(produto.ESTOQUE_ATUAL)||0) + Number(item.QUANTIDADE) });
          await dbInsert('MOVIMENTOS_ESTOQUE', { EMPRESA_ID: venda.EMPRESA_ID||'', PRODUTO_ID: produto.ID, TIPO:'DEVOLUCAO', QUANTIDADE: item.QUANTIDADE, MOTIVO:'Exclusão da venda '+vendaId, USUARIO_ID: usuarioAtual.ID, DATA: new Date().toISOString() });
        }
        await dbDelete('ITENS_VENDA', item.ID);
      }

      const lancamentos = await dbQuery('FINANCEIRO', { ORIGEM_ID: vendaId });
      for (const lanc of lancamentos) await dbDelete('FINANCEIRO', lanc.ID);
      // Fallback: alguns lançamentos antigos não têm ORIGEM_ID -- ignora se não encontrar nenhum.

      const garantiasDaVenda = await dbQuery('GARANTIAS', { VENDA_ID: vendaId });
      for (const g of garantiasDaVenda) await dbDelete('GARANTIAS', g.ID);

      if (venda && venda.CLIENTE_ID) {
        const cliente = await dbGetById('CLIENTES', venda.CLIENTE_ID);
        if (cliente) await dbUpdate('CLIENTES', cliente.ID, { VALOR_GASTO_TOTAL: Math.max(0, (Number(cliente.VALOR_GASTO_TOTAL)||0) - Number(venda.VALOR_TOTAL||0)) });
      }

      await dbDelete('VENDAS', vendaId);
      mostrarToast('Venda excluída e estoque devolvido.');
      carregarHistorico();
    } catch (e) { mostrarToast('Erro ao excluir venda: ' + e.message, 'erro'); }
  };

  // ---------- Enviar nota fiscal (recibo) por WhatsApp ----------
  document.getElementById('btnEnviarNotaWpp').addEventListener('click', () => {
    if (!ultimaVendaParaNota) return;
    const { cliente, itens, venda } = ultimaVendaParaNota;
    const telefone = String(cliente.TELEFONE||'').replace(/\D/g,'');
    const numeroComPais = telefone.length<=11 ? '55'+telefone : telefone;
    const nomeLojaNota = (empresasCarregadas.find(e => e.ID === venda.EMPRESA_ID) || empresasCarregadas[0] || {}).NOME || 'Nossa loja';

    let texto = `🧾 *${nomeLojaNota}* — Comprovante de venda\n\n`;
    texto += itens.map(i => `${i.QUANTIDADE}x ${i.NOME} — ${moeda(i.QUANTIDADE*i.PRECO_UNITARIO)}`).join('\n');
    texto += `\n\n*Subtotal:* ${moeda(itens.reduce((s,i)=>s+i.QUANTIDADE*i.PRECO_UNITARIO,0))}`;
    if (venda.DESCONTO) texto += `\n*Desconto:* ${moeda(venda.DESCONTO)}`;
    texto += `\n*Total pago:* ${moeda(venda.VALOR_TOTAL)}`;
    if (venda.FORMA_PAGAMENTO === 'Combinado' && venda.FORMAS_PAGAMENTO && venda.FORMAS_PAGAMENTO.length) {
      texto += `\n*Forma de pagamento:* Combinado\n` + venda.FORMAS_PAGAMENTO.map(f => `  • ${f.forma}: ${moeda(f.valor)}` + (f.forma==='Cartão de Crédito' && f.parcelas>1 ? ` (${f.parcelas}x)` : '')).join('\n');
    } else {
      texto += `\n*Forma de pagamento:* ${venda.FORMA_PAGAMENTO}`;
    }
    texto += `\n\nObrigado pela preferência, ${cliente.NOME}! 🙏`;

    window.open('https://wa.me/' + numeroComPais + '?text=' + encodeURIComponent(texto), '_blank');
    document.getElementById('notaFiscalWrap').style.display = 'none';
  });

  renderCarrinho();
  carregarHistorico();
})();
</script>
