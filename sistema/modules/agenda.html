<style>
  .notif-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:20px; }
  .notif-card{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; padding:16px 18px; }
  .notif-card.urgente{ border-color:rgba(255,92,92,0.4); background:rgba(255,92,92,0.05); }
  .notif-card.atencao{ border-color:rgba(245,166,35,0.4); background:rgba(245,166,35,0.05); }
  .notif-card .num{ font-family:var(--font-display); font-size:26px; font-weight:700; }
  .notif-card .lbl{ font-size:12px; color:var(--text-secondary); margin-top:4px; }

  .agenda-lista{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:12px; overflow:hidden; }
  .agenda-item{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--hairline); }
  .agenda-item:last-child{ border-bottom:none; }
  .agenda-item .data-badge{ min-width:56px; text-align:center; background:var(--bg-elevated); border-radius:8px; padding:6px 8px; font-family:var(--font-mono); }
  .agenda-item .data-badge .dia{ font-size:16px; font-weight:700; color:var(--mint); }
  .agenda-item .data-badge .mes{ font-size:9.5px; color:var(--text-tertiary); text-transform:uppercase; }
  .agenda-item.atrasado .data-badge .dia{ color:var(--red); }
  .agenda-item .info{ flex:1; }
  .garantia-item{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--hairline); }
  .garantia-item:last-child{ border-bottom:none; }
  .notif-card.clicavel{ cursor:pointer; transition:transform .1s, box-shadow .1s; user-select:none; }
  .notif-card.clicavel:hover{ transform:translateY(-1px); }
  .notif-card.ativo{ box-shadow:0 0 0 2px var(--mint); }
  .ag-filtros{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .ag-filtros input,.ag-filtros select{ background:var(--bg-surface); border:1px solid var(--hairline); color:inherit; border-radius:8px; padding:8px 12px; font-size:13px; }
  .ag-filtros input{ flex:1; min-width:200px; }
  .ag-resumo{ font-size:12px; color:var(--text-tertiary); margin:0 0 8px; }
  .cal-fil{ background:var(--bg-surface); border:1px solid var(--hairline); color:var(--text-secondary); border-radius:20px; padding:6px 13px; font-size:12px; cursor:pointer; }
  .cal-fil.ativo{ border-color:var(--mint); color:var(--text-primary); box-shadow:0 0 0 1px var(--mint); }
  .section-subtitulo{ font-family:var(--font-display); font-size:15px; margin:26px 0 12px; }
</style>

<div class="toolbar"><div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Agenda</h1>
<p style="color:var(--text-secondary); font-size:13px; margin:0;">Aparelhos com entrega planejada — clique num cartão para filtrar.</p></div></div>

<div class="notif-grid" id="notifGrid"></div>

<div class="ag-filtros">
  <input id="agBusca" type="search" placeholder="Buscar por cliente, OS, modelo ou defeito...">
  <select id="agStatus"><option value="">Todos os status</option></select>
  <button class="btn" id="agImprimir" type="button">🖨️ Imprimir lista</button>
</div>
<div class="ag-resumo" id="agResumo"></div>
<div class="agenda-lista" id="agendaLista"></div>

<h3 class="section-subtitulo">💰 Entregues e ainda não pagos <span id="cobTotal" style="font-weight:400; font-size:12.5px; color:var(--text-secondary);"></span></h3>
<div class="ag-filtros" id="cobFiltros">
  <button type="button" class="cal-fil ativo" data-c="todos">Todos</button>
  <button type="button" class="cal-fil" data-c="cobrar">Cobrar hoje / atrasados</button>
  <button type="button" class="cal-fil" data-c="futuro">Cobrança futura</button>
  <button type="button" class="cal-fil" data-c="sem">Sem data de cobrança</button>
</div>
<div class="agenda-lista" id="listaCobrancas"></div>

<h3 class="section-subtitulo">⏳ Garantias perto de vencer (oportunidade de contato)</h3>
<div class="agenda-lista" id="listaGarantiasVencendo"></div>

<script>
(async function(){
  function nomeCliente(id, clientes){ const c = clientes.find(x=>x.ID===id); return c?c.NOME:'—'; }

  try {
    if (!(await checarPermissao('AGENDA','VISUALIZAR'))){ setHTML('agendaLista', 'Sem permissão.'); return; }

    const [ordens, clientes] = await Promise.all([dbGetAll('ASSISTENCIAS'), dbGetAll('CLIENTES')]);
    const abertas = ordens.filter(o => o.STATUS !== 'Entregue' && o.STATUS !== 'Excluído');
    const pendentes = abertas.filter(o => o.PRAZO);
    const semPrevisao = abertas.filter(o => !o.PRAZO);

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const amanha = new Date(hoje); amanha.setDate(amanha.getDate()+1);
    const fim7 = new Date(hoje); fim7.setDate(fim7.getDate()+7);
    const dia = o => { const d = parseDataLocal(o.PRAZO); d.setHours(0,0,0,0); return d; };

    const grupos = {
      atrasados: { rotulo:'Atrasados — já deveriam ter sido entregues', cls:'urgente', fn:o => dia(o) < hoje },
      hoje:      { rotulo:'Pra entregar hoje', cls:'atencao', fn:o => dia(o).getTime() === hoje.getTime() },
      amanha:    { rotulo:'Amanhã', cls:'', fn:o => dia(o).getTime() === amanha.getTime() },
      prox7:     { rotulo:'Nos próximos 7 dias', cls:'', fn:o => dia(o) >= amanha && dia(o) <= fim7 },
      todos:     { rotulo:'Todos com previsão', cls:'', fn:o => true },
      sem:       { rotulo:'Sem previsão de entrega', cls:'', fn:o => false }
    };
    const lista = k => k === 'sem' ? semPrevisao : pendentes.filter(grupos[k].fn);

    // abre já em "Hoje"; se não houver nada hoje, mostra atrasados ou todos
    let filtro = lista('hoje').length ? 'hoje' : (lista('atrasados').length ? 'atrasados' : 'todos');

    const selStatus = document.getElementById('agStatus');
    [...new Set(abertas.map(o => o.STATUS).filter(Boolean))].sort().forEach(st => {
      const op = document.createElement('option'); op.value = st; op.textContent = st; selStatus.appendChild(op);
    });
    const busca = document.getElementById('agBusca');

    function desenharCartoes(){
      setHTML('notifGrid', Object.keys(grupos).map(k =>
        `<div class="notif-card clicavel ${grupos[k].cls} ${k===filtro?'ativo':''}" data-f="${k}"><div class="num">${lista(k).length}</div><div class="lbl">${grupos[k].rotulo}</div></div>`
      ).join(''));
      document.querySelectorAll('#notifGrid .clicavel').forEach(el => el.onclick = () => { filtro = el.dataset.f; desenharCartoes(); desenharLista(); });
    }

    let itensAtuais = [];
    function desenharLista(){
      const termo = busca.value.trim().toLowerCase();
      const st = selStatus.value;
      let itens = lista(filtro).filter(o => !st || o.STATUS === st);
      if (termo) itens = itens.filter(o => [o.NUMERO_OS, nomeCliente(o.CLIENTE_ID, clientes), o.MARCA, o.MODELO, o.DEFEITO_INFORMADO].join(' ').toLowerCase().includes(termo));
      itens = itens.slice().sort((a,b) => (a.PRAZO ? dia(a).getTime() : Infinity) - (b.PRAZO ? dia(b).getTime() : Infinity));
      itensAtuais = itens;
      document.getElementById('agResumo').textContent = itens.length + ' aparelho(s) — ' + grupos[filtro].rotulo;

      setHTML('agendaLista', itens.length ? itens.map(o => {
        const temPrazo = !!o.PRAZO;
        const d = temPrazo ? dia(o) : null;
        const atrasado = temPrazo && d < hoje;
        const cli = clientes.find(x => x.ID === o.CLIENTE_ID);
        const tel = String((cli && cli.TELEFONE) || '').replace(/\D/g,'');
        const numZap = tel ? (tel.length<=11 ? '55'+tel : tel) : '';
        const msg = encodeURIComponent(`Olá, ${cli?cli.NOME:''}! Aqui é da BStyle. Sobre o seu ${o.MARCA||''} ${o.MODELO||'aparelho'} (OS ${o.NUMERO_OS}): `);
        return `<div class="agenda-item ${atrasado?'atrasado':''}">
        <div class="data-badge"><div class="dia">${temPrazo?String(d.getDate()).padStart(2,'0'):'--'}</div><div class="mes">${temPrazo?d.toLocaleDateString('pt-BR',{month:'short'}):'s/ data'}</div></div>
        <div class="info">
          <div class="num-os">${o.NUMERO_OS}</div>
          <div><b>${cli?cli.NOME:'—'}</b> — ${o.MARCA||''} ${o.MODELO||''}</div>
          <div style="color:var(--text-tertiary); font-size:11.5px;">${o.DEFEITO_INFORMADO||''}</div>
        </div>
        ${numZap ? `<a class="btn" style="padding:6px 10px; font-size:11.5px; text-decoration:none;" href="https://wa.me/${numZap}?text=${msg}" target="_blank">💬 WhatsApp</a>` : ''}
        <span class="badge ${atrasado?'danger':'info'}" style="display:inline-flex; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:var(--font-mono); background:${atrasado?'rgba(255,92,92,0.12)':'rgba(76,141,255,0.12)'}; color:${atrasado?'#FF5C5C':'#4C8DFF'};">${o.STATUS}</span>
      </div>`;
      }).join('') : '<div style="padding:40px; text-align:center; color:var(--text-tertiary);">Nenhum aparelho neste filtro.</div>');
    }

    function imprimirLista(){
      if (!itensAtuais.length){ mostrarToast('Nada para imprimir neste filtro.', 'erro'); return; }
      const esc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const agora = new Date();
      const linhas = itensAtuais.map(o => {
        const cli = clientes.find(x => x.ID === o.CLIENTE_ID);
        const prazo = o.PRAZO ? parseDataLocal(o.PRAZO).toLocaleDateString('pt-BR') : '—';
        return `<tr>
          <td class="chk"><span class="box"></span></td>
          <td><b>${esc(o.NUMERO_OS)}</b><br><small>${esc(prazo)}</small></td>
          <td>${esc(cli?cli.NOME:'—')}<br><small>${esc(cli&&cli.TELEFONE||'')}</small></td>
          <td>${esc((o.MARCA||'')+' '+(o.MODELO||''))}</td>
          <td>${esc(o.DEFEITO_INFORMADO||'')}</td>
          <td>${esc(o.STATUS||'')}</td>
          <td class="obs"></td>
        </tr>`;
      }).join('');
      const w = window.open('', '_blank');
      if (!w){ mostrarToast('Libere pop-ups para imprimir.', 'erro'); return; }
      w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Agenda - ${esc(grupos[filtro].rotulo)}</title>
      <style>
        @page{ size:A4 landscape; margin:10mm; }
        body{ font-family:Arial,sans-serif; color:#111; font-size:12px; }
        h1{ font-size:18px; margin:0 0 2px; } .sub{ color:#555; margin-bottom:10px; }
        table{ width:100%; border-collapse:collapse; }
        th,td{ border:1px solid #888; padding:6px 7px; vertical-align:top; }
        th{ background:#eee; text-align:left; font-size:11px; }
        tr{ page-break-inside:avoid; }
        small{ color:#555; }
        td.chk{ width:34px; text-align:center; vertical-align:middle; }
        .box{ display:inline-block; width:20px; height:20px; border:2px solid #111; }
        td.obs{ width:22%; }
      </style></head><body>
      <h1>BStyle — Aparelhos: ${esc(grupos[filtro].rotulo)}</h1>
      <div class="sub">Impresso em ${agora.toLocaleDateString('pt-BR')} às ${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${itensAtuais.length} aparelho(s)</div>
      <table><thead><tr><th>Feito</th><th>OS / Previsão</th><th>Cliente</th><th>Aparelho</th><th>Defeito</th><th>Status</th><th>Observações</th></tr></thead>
      <tbody>${linhas}</tbody></table>
      <script>window.onload=function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>
      </body></html>`);
      w.document.close();
    }
    document.getElementById('agImprimir').onclick = imprimirLista;

    busca.oninput = desenharLista; selStatus.onchange = desenharLista;
    desenharCartoes(); desenharLista();

    // ---------- Entregues e ainda não pagos ----------
    const pagoOS = o => { try { return JSON.parse(o.PAGAMENTOS_OS || '[]').reduce((s,p)=>s+Number(p.valor||0),0); } catch(e){ return 0; } };
    const devendo = ordens
      .filter(o => o.STATUS === 'Entregue' && (Number(o.VALOR_SERVICO||0) - pagoOS(o)) > 0.009)
      .map(o => ({ o, saldo: Number(o.VALOR_SERVICO||0) - pagoOS(o), cob: o.DATA_COBRANCA ? dia({ PRAZO: o.DATA_COBRANCA }) : null }));
    const grupoCob = x => !x.cob ? 'sem' : (x.cob <= hoje ? 'cobrar' : 'futuro');
    let filtroCob = 'todos';
    const fmtMoeda = n => (Number(n)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

    function desenharCobrancas(){
      const lista = devendo.filter(x => filtroCob === 'todos' || grupoCob(x) === filtroCob)
        .sort((a,b) => (a.cob ? a.cob.getTime() : Infinity) - (b.cob ? b.cob.getTime() : Infinity));
      const somaTodos = devendo.reduce((s,x)=>s+x.saldo,0);
      document.getElementById('cobTotal').textContent = devendo.length ? `— ${devendo.length} aparelho(s), ${fmtMoeda(somaTodos)} a receber` : '';
      document.querySelectorAll('#cobFiltros .cal-fil').forEach(b => {
        const c = b.dataset.c; const n = c === 'todos' ? devendo.length : devendo.filter(x => grupoCob(x) === c).length;
        b.textContent = b.textContent.replace(/ \(\d+\)$/, '') + ' (' + n + ')';
      });
      setHTML('listaCobrancas', lista.length ? lista.map(x => {
        const o = x.o, cli = clientes.find(c => c.ID === o.CLIENTE_ID);
        const dias = x.cob ? Math.round((x.cob - hoje) / 86400000) : null;
        let rotulo, cor, bg;
        if (dias === null) { rotulo = 'sem data de cobrança'; cor = '#8891A3'; bg = 'rgba(136,145,163,0.14)'; }
        else if (dias < 0) { rotulo = 'cobrança atrasada ' + Math.abs(dias) + 'd'; cor = '#FF5C5C'; bg = 'rgba(255,92,92,0.12)'; }
        else if (dias === 0) { rotulo = 'cobrar hoje'; cor = '#F5A623'; bg = 'rgba(245,166,35,0.14)'; }
        else { rotulo = 'cobrar em ' + dias + 'd'; cor = '#4C8DFF'; bg = 'rgba(76,141,255,0.12)'; }
        const tel = String((cli && cli.TELEFONE) || '').replace(/\D/g,'');
        const numZap = tel ? (tel.length<=11 ? '55'+tel : tel) : '';
        const msg = encodeURIComponent(`Olá, ${cli?cli.NOME:''}! Aqui é da BStyle. Passando para lembrar do pagamento pendente do serviço no seu ${o.MARCA||''} ${o.MODELO||'aparelho'} (OS ${o.NUMERO_OS}), no valor de ${fmtMoeda(x.saldo)}. Quando puder, nos avise por aqui!`);
        return `<div class="agenda-item ${dias!==null && dias<0 ? 'atrasado':''}">
          <div class="data-badge"><div class="dia">${x.cob ? String(x.cob.getDate()).padStart(2,'0') : '--'}</div><div class="mes">${x.cob ? x.cob.toLocaleDateString('pt-BR',{month:'short'}) : 's/ data'}</div></div>
          <div class="info">
            <div class="num-os">${o.NUMERO_OS}</div>
            <div><b>${cli?cli.NOME:'—'}</b> — ${o.MARCA||''} ${o.MODELO||''}</div>
            <div style="color:var(--text-tertiary); font-size:11.5px;">Falta pagar ${fmtMoeda(x.saldo)}${o.DATA_ENTREGA_REAL ? ' · entregue em ' + new Date(o.DATA_ENTREGA_REAL).toLocaleDateString('pt-BR') : ''}</div>
          </div>
          ${numZap ? `<a class="btn" style="padding:6px 10px; font-size:11.5px; text-decoration:none;" href="https://wa.me/${numZap}?text=${msg}" target="_blank">💬 Cobrar</a>` : ''}
          <span style="display:inline-flex; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:var(--font-mono); background:${bg}; color:${cor};">${rotulo}</span>
        </div>`;
      }).join('') : '<div style="padding:30px; text-align:center; color:var(--text-tertiary);">Nenhum aparelho entregue com pagamento pendente neste filtro.</div>');
    }
    document.querySelectorAll('#cobFiltros .cal-fil').forEach(b => b.onclick = () => {
      filtroCob = b.dataset.c;
      document.querySelectorAll('#cobFiltros .cal-fil').forEach(x => x.classList.toggle('ativo', x === b));
      desenharCobrancas();
    });
    desenharCobrancas();

  } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }

  // ---------- Garantias perto de vencer ----------
  try {
    if (!(await checarPermissao('AGENDA','VISUALIZAR'))){ setHTML('listaGarantiasVencendo', 'Sem permissão.'); return; }
    const [garantias, clientesGar] = await Promise.all([dbGetAll('GARANTIAS'), dbGetAll('CLIENTES')]);
    const hoje = new Date();

    function dataVencimento(g){
      const base = g.TIPO === 'MANUTENCAO' ? (g.DATA_CONCLUSAO || g.DATA_EMISSAO) : g.DATA_EMISSAO;
      const d = new Date(base);
      d.setDate(d.getDate() + Number(g.PRAZO_DIAS||0));
      return d;
    }

    const vencendo = garantias
      .filter(g => g.STATUS === 'Ativa')
      .map(g => ({ ...g, _vencimento: dataVencimento(g) }))
      .filter(g => { const dias = (g._vencimento - hoje) / 86400000; return dias >= 0 && dias <= 15; })
      .sort((a,b) => a._vencimento - b._vencimento);

    function nomeClienteGar(id){ const c = clientesGar.find(x=>x.ID===id); return c?c.NOME:'—'; }
    function telefoneCliente(id){ const c = clientesGar.find(x=>x.ID===id); return c?c.TELEFONE:''; }

    setHTML('listaGarantiasVencendo', vencendo.length ? vencendo.map(g => {
      const diasRestantes = Math.ceil((g._vencimento - hoje) / 86400000);
      const telefone = String(telefoneCliente(g.CLIENTE_ID)||'').replace(/\D/g,'');
      const numeroComPais = telefone ? (telefone.length<=11 ? '55'+telefone : telefone) : '';
      const msg = encodeURIComponent(`Olá, ${nomeClienteGar(g.CLIENTE_ID)}! Passando para lembrar que a garantia do seu ${g.PRODUTO_DESCRICAO||'aparelho'} (${g.NUMERO_GARANTIA}) vence em ${diasRestantes} dia(s). Qualquer problema, é só nos procurar!`);
      return `<div class="garantia-item">
        <div style="flex:1;">
          <div class="num-os" style="font-family:var(--font-mono); color:var(--blue); font-size:11.5px;">${g.NUMERO_GARANTIA}</div>
          <div><b>${nomeClienteGar(g.CLIENTE_ID)}</b> — ${g.PRODUTO_DESCRICAO||''}</div>
        </div>
        <span class="badge" style="background:rgba(245,166,35,0.12); color:var(--amber); padding:3px 9px; border-radius:20px; font-size:11px; font-family:var(--font-mono);">vence em ${diasRestantes}d</span>
        ${numeroComPais ? `<a class="btn" style="padding:6px 10px; font-size:11.5px; text-decoration:none;" href="https://wa.me/${numeroComPais}?text=${msg}" target="_blank">💬 WhatsApp</a>` : ''}
      </div>`;
    }).join('') : '<div style="padding:30px; text-align:center; color:var(--text-tertiary);">Nenhuma garantia vencendo nos próximos 15 dias.</div>');

  } catch (e) { mostrarToast('Erro ao carregar garantias: ' + e.message, 'erro'); }
})();
</script>
