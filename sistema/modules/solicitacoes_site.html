<style>
  .badge{ display:inline-flex; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; font-family:var(--font-mono); white-space:nowrap; }
  .badge.novo{ background:rgba(245,166,35,0.15); color:var(--amber); }
  .badge.andamento{ background:rgba(90,150,255,0.15); color:var(--blue); }
  .badge.concluido{ background:rgba(47,225,168,0.12); color:var(--mint); }
  .badge.cancelado{ background:rgba(255,92,92,0.12); color:var(--red); }
  .modal-overlay{ position:fixed; inset:0; background:rgba(3,5,8,0.6); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--bg-surface); border:1px solid var(--hairline); border-radius:14px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--hairline); }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--hairline); flex-wrap:wrap; }
  .modal-close{ background:none; border:none; color:var(--text-tertiary); font-size:18px; cursor:pointer; }
  .linha-detalhe{ display:flex; gap:8px; margin-bottom:12px; font-size:13px; }
  .linha-detalhe b{ flex:0 0 130px; color:var(--text-secondary); font-weight:500; }
  .fotos-solicitacao{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .fotos-solicitacao img{ width:88px; height:88px; object-fit:cover; border-radius:10px; border:1px solid var(--hairline); cursor:pointer; }
</style>

<div class="toolbar">
  <div><h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 4px;">Solicitações do Site</h1>
  <p style="color:var(--text-secondary); font-size:13px; margin:0;">Pedidos de orçamento enviados pelo site institucional da BStyle.</p></div>
</div>

<div style="margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap;">
  <input id="buscaSolicitacao" placeholder="Buscar por nome, WhatsApp ou número…" style="background:var(--bg-surface); border:1px solid var(--hairline); color:var(--text-primary); padding:9px 12px; border-radius:8px; font-size:12.5px; min-width:220px;">
  <select id="filtroStatusSolicitacao" style="background:var(--bg-surface); border:1px solid var(--hairline); color:var(--text-primary); padding:9px 12px; border-radius:8px; font-size:12.5px;">
    <option value="">Todos os status</option>
    <option value="Novo">Novo</option>
    <option value="Em Atendimento">Em Atendimento</option>
    <option value="Concluído">Concluído</option>
    <option value="Cancelado">Cancelado</option>
  </select>
  <button class="btn" id="btnLimparFiltroSolicitacao" style="padding:8px 12px;">Limpar</button>
</div>

<div class="kpi-grid" style="margin-bottom:20px;">
  <div class="kpi"><div class="lbl">Novas</div><div class="val" id="kpiNovas">—</div></div>
  <div class="kpi"><div class="lbl">Em atendimento</div><div class="val" id="kpiAndamento">—</div></div>
  <div class="kpi"><div class="lbl">Concluídas (30 dias)</div><div class="val" id="kpiConcluidas">—</div></div>
</div>

<table class="dt"><thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Tipo</th><th>Produto</th><th>Status</th><th></th></tr></thead>
  <tbody id="linhas"><tr class="empty-row"><td colspan="7">Carregando…</td></tr></tbody>
</table>

<div class="modal-overlay" id="modalDetalhe">
  <div class="modal-box">
    <div class="modal-head"><h3 style="font-family:var(--font-display); margin:0;" id="tituloDetalhe">Solicitação</h3><button class="modal-close" id="fecharModalDetalhe">✕</button></div>
    <div class="modal-body" id="corpoDetalhe"></div>
    <div class="modal-foot">
      <select id="fStatusDetalhe" style="background:var(--bg-elevated); border:1px solid var(--hairline); color:var(--text-primary); padding:9px 12px; border-radius:8px; font-size:12.5px;">
        <option value="Novo">Novo</option>
        <option value="Em Atendimento">Em Atendimento</option>
        <option value="Concluído">Concluído</option>
        <option value="Cancelado">Cancelado</option>
      </select>
      <button class="btn" id="btnSalvarStatus">Salvar status</button>
      <a class="btn btn-primary" id="btnWhatsappDetalhe" target="_blank" rel="noopener">💬 Abrir WhatsApp</a>
    </div>
  </div>
</div>

<script>
(function(){
  let solicitacoes = [];
  let solicitacaoAtual = null;

  function classeBadge(status){
    return { 'Novo':'novo', 'Em Atendimento':'andamento', 'Concluído':'concluido', 'Cancelado':'cancelado' }[status] || 'novo';
  }

  function linkWhatsapp(numero, mensagem){
    const n = String(numero||'').replace(/\D/g, '');
    return 'https://wa.me/' + n + (mensagem ? ('?text=' + encodeURIComponent(mensagem)) : '');
  }

  function listaFiltrada(){
    const termo = (document.getElementById('buscaSolicitacao').value || '').toLowerCase().trim();
    const status = document.getElementById('filtroStatusSolicitacao').value;
    return solicitacoes.filter(s => {
      if (status && s.STATUS !== status) return false;
      if (!termo) return true;
      return [s.NOME, s.WHATSAPP, s.NUMERO].join(' ').toLowerCase().includes(termo);
    });
  }

  function renderKpis(){
    const novas = solicitacoes.filter(s => s.STATUS === 'Novo').length;
    const andamento = solicitacoes.filter(s => s.STATUS === 'Em Atendimento').length;
    const ha30dias = Date.now() - 30*24*60*60*1000;
    const concluidas = solicitacoes.filter(s => s.STATUS === 'Concluído' && new Date(s.DATA_CRIACAO||0).getTime() >= ha30dias).length;
    document.getElementById('kpiNovas').textContent = novas;
    document.getElementById('kpiAndamento').textContent = andamento;
    document.getElementById('kpiConcluidas').textContent = concluidas;
  }

  function renderLinhas(){
    const lista = listaFiltrada();
    if (!lista.length){ setHTML('linhas', '<tr class="empty-row"><td colspan="7">Nenhuma solicitação encontrada.</td></tr>'); return; }
    setHTML('linhas', lista.map(s => `
      <tr>
        <td class="mono">#${s.NUMERO||'—'}</td>
        <td>${s.DATA_CRIACAO ? new Date(s.DATA_CRIACAO).toLocaleString('pt-BR') : '—'}</td>
        <td><b>${s.NOME||'—'}</b><br><span style="color:var(--text-tertiary); font-size:11.5px;">${s.WHATSAPP||''}</span></td>
        <td>${s.TIPO_ATENDIMENTO||'—'}</td>
        <td>${s.PRODUTO||'—'}</td>
        <td><span class="badge ${classeBadge(s.STATUS)}">${s.STATUS||'Novo'}</span></td>
        <td><button class="btn" style="padding:6px 10px; font-size:12px;" onclick="window.__verSolicitacao('${s.ID}')">Ver</button></td>
      </tr>
    `).join(''));
  }

  window.__verSolicitacao = (id) => {
    solicitacaoAtual = solicitacoes.find(s => s.ID === id);
    if (!solicitacaoAtual) return;
    const s = solicitacaoAtual;
    document.getElementById('tituloDetalhe').textContent = 'Solicitação #' + (s.NUMERO || '—');
    const fotos = Array.isArray(s.FOTOS) ? s.FOTOS : [];
    setHTML('corpoDetalhe', `
      <div class="linha-detalhe"><b>Cliente</b><span>${s.NOME||'—'}</span></div>
      <div class="linha-detalhe"><b>WhatsApp</b><span>${s.WHATSAPP||'—'}</span></div>
      <div class="linha-detalhe"><b>E-mail</b><span>${s.EMAIL||'—'}</span></div>
      <div class="linha-detalhe"><b>Tipo</b><span>${s.TIPO_ATENDIMENTO||'—'}</span></div>
      <div class="linha-detalhe"><b>Produto/aparelho</b><span>${s.PRODUTO||'—'}</span></div>
      <div class="linha-detalhe"><b>Recebido em</b><span>${s.DATA_CRIACAO ? new Date(s.DATA_CRIACAO).toLocaleString('pt-BR') : '—'}</span></div>
      <div class="linha-detalhe"><b>Descrição</b><span>${(s.DESCRICAO||'—').replace(/\n/g,'<br>')}</span></div>
      ${fotos.length ? `<div class="linha-detalhe"><b>Fotos</b><div class="fotos-solicitacao">${fotos.map(f => `<img src="${f}" onclick="window.open('${f}','_blank')">`).join('')}</div></div>` : ''}
    `);
    document.getElementById('fStatusDetalhe').value = s.STATUS || 'Novo';
    document.getElementById('btnWhatsappDetalhe').href = linkWhatsapp(s.WHATSAPP, 'Olá, ' + (s.NOME||'') + '! Aqui é da BStyle, vimos sua solicitação de orçamento (#' + (s.NUMERO||'') + ').');
    document.getElementById('modalDetalhe').classList.add('open');
  };

  document.getElementById('fecharModalDetalhe').addEventListener('click', () => document.getElementById('modalDetalhe').classList.remove('open'));

  document.getElementById('btnSalvarStatus').addEventListener('click', async () => {
    if (!solicitacaoAtual) return;
    try {
      if (!(await checarPermissao('SOLICITACOES_SITE','EDITAR'))){ mostrarToast('Sem permissão.', 'erro'); return; }
      const novoStatus = document.getElementById('fStatusDetalhe').value;
      await dbUpdate('ORCAMENTOS_SITE', solicitacaoAtual.ID, { STATUS: novoStatus });
      mostrarToast('Status atualizado.');
      document.getElementById('modalDetalhe').classList.remove('open');
      carregar();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  });

  document.getElementById('buscaSolicitacao').addEventListener('input', renderLinhas);
  document.getElementById('filtroStatusSolicitacao').addEventListener('change', renderLinhas);
  document.getElementById('btnLimparFiltroSolicitacao').addEventListener('click', () => {
    document.getElementById('buscaSolicitacao').value = '';
    document.getElementById('filtroStatusSolicitacao').value = '';
    renderLinhas();
  });

  async function carregar(){
    try {
      if (!(await checarPermissao('SOLICITACOES_SITE','VISUALIZAR'))){ setHTML('linhas', '<tr class="empty-row"><td colspan="7">Sem permissão.</td></tr>'); return; }
      solicitacoes = (await dbGetAll('ORCAMENTOS_SITE')).sort((a,b) => new Date(b.DATA_CRIACAO||0) - new Date(a.DATA_CRIACAO||0));
      renderKpis();
      renderLinhas();
    } catch (e) { mostrarToast('Erro: ' + e.message, 'erro'); }
  }

  carregar();
})();
</script>
